# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Change the limit on the maximum number of pull requests for version updates open at any time.
    # Default value: 5
    # Set to 0 in order to disable opening PRs for maven dependencies.
    # see https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#open-pull-requests-limit-
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "de.interactive_instruments:ldproxy-cfg"
        # ignore patch versions
        update-types: ["version-update:semver-patch"]
    # Create a group of dependencies to be updated together in one pull request
    groups:
       # Specify a name for the group, which will be used in pull request titles
       # and branch names
       slf4j:
          applies-to: version-updates
          patterns:
            - "org.slf4j*"
       junit-jupiter:
          applies-to: version-updates
          patterns:
            - "org.junit.jupiter*"
       xmlunit:
          applies-to: version-updates
          patterns:
            - "org.xmlunit*"
       fasterxml-jackson:
          applies-to: version-updates
          patterns:
            - "com.fasterxml.jackson*"
       apache-poi:
          applies-to: version-updates
          patterns:
            - "org.apache.poi*"